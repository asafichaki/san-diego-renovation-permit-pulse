<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>San Diego Renovation Permit Pulse — Embeddable chart</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#17201c;font:14px/1.4 Inter,system-ui,sans-serif}.widget{min-height:100vh;padding:24px;border:1px solid #d9d4c9;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:18px;align-items:start}.eyebrow{color:#194c3b;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font:500 clamp(24px,6vw,43px)/.98 Georgia,serif;letter-spacing:-.04em;margin:7px 0 8px}.stamp{color:#657069;font-size:10px;text-align:right}.rows{margin:18px 0}.row{display:grid;grid-template-columns:85px 1fr 45px;gap:10px;align-items:center;margin:10px 0}.label{font-weight:750;font-size:11px}.track{height:12px;background:#e1ddd3;border-radius:20px;overflow:hidden}.bar{height:100%;min-width:3px;border-radius:20px}.count{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.foot{display:flex;justify-content:space-between;gap:15px;margin-top:auto;padding-top:15px;border-top:1px solid #d9d4c9;color:#657069;font-size:10px}.foot a{color:#194c3b;font-weight:750;text-decoration:none}@media(max-width:420px){.widget{padding:17px}.stamp{display:none}.row{grid-template-columns:72px 1fr 38px}}
  </style>
</head>
<body>
  <main class="widget">
    <div class="top"><div><div class="eyebrow">2026 year to date</div><h1>San Diego renovation permit pulse</h1></div><div class="stamp" id="stamp">Loading…</div></div>
    <div class="rows" id="rows"></div>
    <div class="foot"><span>Unique projects per named scope; categories can overlap.</span><a href="https://asafichaki.github.io/san-diego-renovation-permit-pulse/" target="_blank" rel="noopener">Explore data · Renology →</a></div>
  </main>
  <script>
    const colors=['#194c3b','#ff765e','#6d9dff','#e6b94b','#7d6ca8'];
    fetch('data/summary.json').then(r=>r.json()).then(d=>{
      document.getElementById('stamp').textContent=`City data updated ${d.city_source_last_modified}`;
      const max=Math.max(...d.categories.map(x=>x.issued_projects));
      document.getElementById('rows').innerHTML=d.categories.map((x,i)=>`<div class="row"><div class="label">${x.category}</div><div class="track"><div class="bar" style="width:${x.issued_projects/max*100}%;background:${colors[i]}"></div></div><div class="count">${x.issued_projects.toLocaleString()}</div></div>`).join('');
    }).catch(()=>document.getElementById('rows').textContent='Snapshot temporarily unavailable.');
  </script>
</body>
</html>
